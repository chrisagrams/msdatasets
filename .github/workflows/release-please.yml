name: Release Please

# Two-phase release flow (dev -> stage -> main):
#   push to dev:  open/update the release PR (targets dev). Never tags.
#   push to main: tag + GitHub Release for any merged release PR that has
#                 been promoted to main. The published release triggers
#                 publish.yml (PyPI) and docs.yml (GitHub Pages).
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Use a GitHub App token, not GITHUB_TOKEN, for two reasons:
      # - The release is tagged at the release commit on dev, and if a workflow
      #   change has been promoted to main since then, that commit's
      #   .github/workflows/ differs from the default branch. Creating a release
      #   there requires the Workflows permission, which GITHUB_TOKEN can never
      #   have (fails with 403 "Resource not accessible by integration").
      # - Releases created with GITHUB_TOKEN do not trigger other workflows, so
      #   publish.yml and docs.yml (on: release) would never run.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Release PRs always live on dev, so both phases look at dev's PRs.
          target-branch: dev
          # Only tag/release from main (once the release PR has been promoted).
          skip-github-release: ${{ github.ref_name != 'main' }}
          # Only open/update the release PR from dev.
          skip-github-pull-request: ${{ github.ref_name != 'dev' }}
