site_name: msdatasets
site_description: A unified dataset framework for mass spectrometry
site_url: https://chrisagrams.github.io/msdatasets
repo_url: https://github.com/chrisagrams/msdatasets
repo_name: chrisagrams/msdatasets

watch:
  - src

theme:
  name: material
  variant: classic
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: numpy
            docstring_section_style: table
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_"]
  # Must come after mkdocstrings so API reference pages are rendered first.
  # Emits /llms.txt (index), /llms-full.txt (all pages concatenated), and a
  # Markdown copy of every listed page next to its HTML (e.g. /usage/index.md).
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        msdatasets is a Python client and CLI for downloading mass
        spectrometry datasets from the msdatasets server, by server UUID,
        PRIDE / MassIVE accession, or HuggingFace dataset repo. Downloads are
        cached on disk as `.mszx`, `.msz`, or `.mzML`, and can be loaded as a
        PyTorch `Dataset`. Every page below is available as Markdown;
        `llms-full.txt` contains all of them in one file.
      sections:
        Getting started:
          - index.md
          - getting-started.md
        Usage:
          - usage.md
        API reference:
          - api.md

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - API Reference: api.md

extra:
  generator: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
